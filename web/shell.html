<!doctype html>
<!--
  Page for the browser build (make web): emcc puts the generated loader where
  the SCRIPT placeholder is. The canvas fills the window; SDL sizes the game
  to the canvas's CSS size and follows it when the window is resized.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkiFree</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #fff;
  }
  canvas {
    display: block;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    outline: none;
    touch-action: none;
    /* Keep WebGL composited when HUD overlays move/shrink on resize. */
    opacity: 0.999;
  }
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 14px system-ui, sans-serif;
    color: #444;
  }
  #network-status, #network-controls {
    position: fixed;
    left: 12px;
    z-index: 1;
    padding: 8px 10px;
    border: 1px solid #222;
    background: #fff;
    color: #222;
    font: 12px/1.5 monospace;
    white-space: pre-line;
    pointer-events: none;
    max-width: calc(100% - 46px);
  }
  #network-status { top: 12px; width: 380px; }
  #network-controls { bottom: 12px; }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
<div id="loading">Loading SkiFree…</div>
<div id="network-status" role="status" hidden>Joining the public mountain…</div>
<div id="network-controls" hidden>↓ Ski · ← → Turn · Space Hop · F2 Restart
Mouse steers · Click hops · No pause on the public mountain</div>
<script>
  var loading = document.getElementById('loading');
  var Module = {
    canvas: document.getElementById('canvas'),
    onRuntimeInitialized: function () { loading.remove(); },
    onAbort: function (what) { loading.textContent = 'SkiFree failed to start: ' + what; },
  };
  // SDL blocks the browser's default action for every key it handles,
  // including shortcuts like Ctrl+R and F5. The game uses no modifier keys
  // and only F2/F3, so hand those keys back to the browser before SDL sees
  // them (SDL listens on window in the bubble phase).
  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.altKey || e.metaKey || /^F([14-9]|1[0-2])$/.test(e.key))
      e.stopImmediatePropagation();
  }, true);
</script>
<script src="multiplayer.js"></script>
{{{ SCRIPT }}}
</body>
</html>
