services:
  web:
    # make serve builds the browser and authoritative server on port 8000.
    # Restart the service to pick up source changes.
    command: make serve
    port: 8000
    portal:
      title: SkiFree
  www:
    # The cmb.software brochure site (www/), with Astro's live reload.
    cwd: www
    command: pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0 --port "$PORT"
    health: /skifree-wasm/
    portal:
      url: /skifree-wasm/
      title: Brochure site
